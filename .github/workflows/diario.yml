name: Diário (6 por dia, horário de pico)

# Plantão diário (a partir de 20/11/2026): 4 turnos de ~6 h por dia (00:50, 06:50, 12:50 e 18:50 de Brasília).
# Corta (GTA do Alanzoka primeiro, depois os canais do canais.yaml) e publica no máximo 6 por dia, a cada 2 h,
# das 11h às 22h59 de Brasília (ajustes.py, 24/11/2026: 1 por hora derrubou o alcance).
on:
  schedule:
    - cron: "50 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-gta-v2
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Desempacotar o código
        run: python -c "import base64,io,zipfile; zipfile.ZipFile(io.BytesIO(base64.b64decode(open('pacote.b64').read()))).extractall('.')"

      - name: Ajustes (ritmo, visual, legenda do jogo, gancho por IA)
        run: python ajustes.py

      - name: ffmpeg, fontes e Tesseract (legenda do jogo)
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer tesseract-ocr tesseract-ocr-por > /dev/null
          fc-cache -f > /dev/null
          tesseract --list-langs

      - name: Bibliotecas
        run: pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-turbo-v1

      - name: Preparar (segredos e satisfatórios)
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python preparar_nuvem.py

      - name: Plantão diário (6 por dia)
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u diario.py --turno 345

      - name: Guardar os vídeos do teste para conferir
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cortes-diario
          path: saida/**/*.mp4
          if-no-files-found: ignore
          retention-days: 3

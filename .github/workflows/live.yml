name: Live GTA 6 (Alanzoka)

# Plantão em turnos de ~6 h nos dias 18 e 19/11/2026 (horários em UTC: 04:30, 10:30, 16:30 e 22:30 =
# 01:30, 07:30, 13:30 e 19:30 de Brasília). Em cada turno o robô olha a live a cada 5 min, corta os
# blocos novos e publica na hora.
on:
  schedule:
    - cron: "30 4,10,16,22 18,19 11 *"
    - cron: "30 4 20 11 *"
  workflow_dispatch:
    inputs:
      teste_url:
        description: "URL de uma live gravada da Twitch para testar (corta 1 bloco e NÃO publica)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: live-gta
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Desempacotar o código
        run: python -c "import base64,io,zipfile; zipfile.ZipFile(io.BytesIO(base64.b64decode(open('pacote.b64').read()))).extractall('.')"

      - name: ffmpeg e fontes (Arial Black das legendas)
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer > /dev/null
          fc-cache -f > /dev/null

      - name: Bibliotecas
        run: pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Preparar (segredos e satisfatórios)
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python preparar_nuvem.py

      - name: Teste (não publica)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.teste_url != '' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python -u live_gta.py --teste "${{ inputs.teste_url }}"

      - name: Plantão da live
        if: ${{ github.event_name == 'schedule' || inputs.teste_url == '' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python -u live_gta.py --turno 345

      - name: Guardar os vídeos do teste para conferir
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cortes
          path: saida/**/*.mp4
          if-no-files-found: ignore
          retention-days: 3
